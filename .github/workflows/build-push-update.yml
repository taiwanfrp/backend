name: Build, Push to GHCR, and Update Manifests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'tests/**'
      - '.github/workflows/build-push-update.yml'
      - '.github/workflows/ci.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Dockerfile'
      - '.pre-commit-config.yaml'

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # 允許推送到 GHCR
    # 新的 push 會取消還在 build 的舊版本
    concurrency:
      group: ${{ github.workflow }}-build-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      subject: ${{ steps.meta.outputs.subject }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get Image Tag and Commit Message
        id: meta
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "subject=$(git log -1 --format=%s)" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/backend:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # 不取消執行中的部署, 等待中的只保留最新的一個
    concurrency:
      group: ${{ github.workflow }}-deploy-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout GitOps Manifests Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/gitops
          path: gitops
          token: ${{ secrets.DEPLOY_PAT }}
          ref: main

      - name: Update Deployment Image Tag
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER_LC}/backend:${TAG}"
          sed -i "s|image: ghcr.io/${OWNER_LC}/backend:.*|image: ${IMAGE}|g" gitops/backend/deployment.yaml
          sed -i "s|image: ghcr.io/${OWNER_LC}/backend:.*|image: ${IMAGE}|g" gitops/backend/docker-compose.yml
        env:
          TAG: ${{ needs.build.outputs.tag }}

      - name: Import GPG Key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          # passphrase: ${{ secrets.GPG_PASSPHRASE }}
          workdir: gitops
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_committer_name: "TaiwanFRP Deploy Bot"
          git_committer_email: "deploy@taiwanfrp.me"

      - name: Commit and Push Changes
        working-directory: gitops
        run: |
          git config user.name "TaiwanFRP Deploy Bot"
          git config user.email "deploy@taiwanfrp.me"

          # 重跑同一個 commit 時 tag 沒有變
          if git diff --quiet; then
            echo "Image tag is already ${TAG}, nothing to commit"
            exit 0
          fi

          git commit -a -S -m "deploy(backend): ${COMMIT_SUBJECT}" -m "Update image tag to ${TAG}"

          # 其他 repo 可能同時推送到 gitops
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "Push failed (attempt ${attempt}), retrying"
            sleep 5
          done
          exit 1
        env:
          TAG: ${{ needs.build.outputs.tag }}
          COMMIT_SUBJECT: ${{ needs.build.outputs.subject }}
