name: Build, Push to GHCR, and Update Manifests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'tests/**'
      - '.github/workflows/build-push-update.yml'
      - '.github/workflows/ci.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Dockerfile'
      - '.pre-commit-config.yaml'

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build (${{ matrix.arch }})
    needs: check
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write # 允許推送到 GHCR
    concurrency:
      group: ${{ github.workflow }}-build-${{ matrix.arch }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/${{ matrix.arch }}
          tags: ghcr.io/${{ github.repository_owner }}/backend:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

  manifest:
    name: Push multi-arch tags
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      subject: ${{ steps.meta.outputs.subject }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get Image Tag and Commit Message
        id: meta
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "subject=$(git log -1 --format=%s)" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create Multi-Arch Tags
        run: |
          image="ghcr.io/${OWNER,,}/backend"
          docker buildx imagetools create \
            -t "${image}:${TAG}" -t "${image}:latest" \
            "${image}:${GITHUB_SHA}-amd64" "${image}:${GITHUB_SHA}-arm64"
        env:
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ steps.meta.outputs.tag }}

  deploy:
    needs: manifest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-deploy-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout GitOps Manifests Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/gitops
          path: gitops
          token: ${{ secrets.DEPLOY_PAT }}
          ref: main

      - name: Update Deployment Image Tag
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER_LC}/backend:${TAG}"
          sed -i "s|image: ghcr.io/${OWNER_LC}/backend:.*|image: ${IMAGE}|g" gitops/backend/deployment.yaml
          sed -i "s|image: ghcr.io/${OWNER_LC}/backend:.*|image: ${IMAGE}|g" gitops/backend/docker-compose.yml
        env:
          TAG: ${{ needs.manifest.outputs.tag }}

      - name: Import GPG Key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          # passphrase: ${{ secrets.GPG_PASSPHRASE }}
          workdir: gitops
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_committer_name: "TaiwanFRP Deploy Bot"
          git_committer_email: "deploy@taiwanfrp.me"

      - name: Commit and Push Changes
        working-directory: gitops
        run: |
          git config user.name "TaiwanFRP Deploy Bot"
          git config user.email "deploy@taiwanfrp.me"

          if git diff --quiet; then
            echo "Image tag is already ${TAG}, nothing to commit"
            exit 0
          fi

          git commit -a -S -m "deploy(backend): ${COMMIT_SUBJECT}" -m "Update image tag to ${TAG}"

          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "Push failed (attempt ${attempt}), retrying"
            sleep 5
          done
          exit 1
        env:
          TAG: ${{ needs.manifest.outputs.tag }}
          COMMIT_SUBJECT: ${{ needs.manifest.outputs.subject }}
